name: Build 25.12.x QEMU-armsr-armv8
# ARM64 通用型 ImmortalWrt（25.12 / apk）
# 产出：.img.gz / .qcow2 / .vmdk
# 适用：UTM、PVE(QEMU)、N1/R3S/R5S 等 ARM64 虚拟机
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择 luci / ImmortalWrt 版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口设备有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        type: choice
        description: |
          可用于 ARM64 虚拟机（macOS UTM / 斐讯 N1 / R3S / R5S 等 arm64 系统的 PVE）
        options:
          - generic
        required: true
        default: "generic"
      rootfs_partsize:
        description: "设置软件包大小 单位(MB) 最大数值10240"
        required: true
        default: "2048"
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"
      enable_pppoe:
        description: "是否配置 PPPoE 拨号信息?"
        required: true
        default: "no"
        type: choice
        options:
          - "yes"
          - "no"
      pppoe_account:
        description: "宽带账号 (若启用 PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用 PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/armsr-armv8/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是: ${{ github.event.inputs.custom_router_ip }}"
          # 映射到镜像内 /etc/config/custom_router_ip.txt，由 99-custom.sh 读取（仅多网口生效）

      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Building armsr-armv8 QEMU ImmortalWrt 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          include_docker="${{ github.event.inputs.include_docker }}"

          echo "Building profile=$profile ROOTFS=$rootfs_partsize luci=$luci_version docker=$include_docker"

          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/armsr-armv8/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$profile \
            -e ROOTFS_PARTSIZE=$rootfs_partsize \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            immortalwrt/imagebuilder:armsr-armv8-openwrt-${luci_version} \
            /bin/bash /home/build/immortalwrt/build.sh

      - name: Copy Firmware to workspace
        run: |
          set -e
          ls -lah ${{ github.workspace }}/bin/targets/armsr/armv8/ || true
          # 常用镜像格式
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*combined-efi.img.gz ${{ github.workspace }}/ 2>/dev/null || true
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*combined-efi.qcow2* ${{ github.workspace }}/ 2>/dev/null || true
          cp ${{ github.workspace }}/bin/targets/armsr/armv8/*combined-efi.vmdk* ${{ github.workspace }}/ 2>/dev/null || true
          echo "==== workspace artifacts ===="
          ls -lh ${{ github.workspace }}/*.{img.gz,qcow2,qcow2.gz,vmdk,vmdk.gz} 2>/dev/null || echo "No matching artifacts found"

      - name: Create release info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## ImmortalWrt QEMU armsr-armv8 25.12.x

          - **后台地址（多网口）**: ${{ github.event.inputs.custom_router_ip }}
          - **单网口设备**: 默认 DHCP，请在上级路由器查看分配的 IP
          - **用户名**: root
          - **密码**: 无（或 password）
          - **版本**: ${{ github.event.inputs.luci_version }}
          - **RootFS 大小**: ${{ github.event.inputs.rootfs_partsize }} MB
          - **Docker**: ${{ github.event.inputs.include_docker }}
          - **产出格式**: .img.gz / .qcow2 / .vmdk

          > 单网口虚拟机（UTM / 多数 QEMU）默认走 DHCP；固定 IP 仅对多网口设备生效。
          EOF

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: QEMU-25.12
          name: ImmortWrt-QEMU-armsr-armv8-25.12.x
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/*.img.gz
            ${{ github.workspace }}/*.qcow2
            ${{ github.workspace }}/*.vmdk
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
